name: Live French data check

# Downloads the current Kenneth R. French Data Library files, rebuilds Mom from the six size/momentum
# portfolios and runs the engine cross-check on the fresh data. Nothing is uploaded: no artifacts, no cache,
# no commit (redistribution rights for the data are unclear).
on:
  schedule:
    - cron: "41 7 * * 2" # Tuesdays 07:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (lockfiles only)
        run: |
          npm ci --ignore-scripts
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Download, parse and check Mom replication
        # Gate: max |rebuilt − published Mom| <= 0.00015 (rounding of 2-decimal percents) and correlation >= 0.9999.
        run: python scripts/fetch_french.py --check-replication

      - name: Parser tests still pass (fixtures)
        run: python -m pytest tests/python/test_french_csv.py -q

      - name: Engine vs Python reference on the fresh data
        run: node --test tests/js/crosscheck.test.mjs

      - name: Remove the data
        if: always()
        run: rm -rf docs/data/local
