name: Citations (live Crossref)

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  push:
    branches: [main]
    paths: [docs/data/citations.json, scripts/check_citations.py]
  pull_request:
    paths: [docs/data/citations.json, scripts/check_citations.py]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossref:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Schema
        run: python scripts/check_citations.py --offline
      - name: Every DOI against Crossref (title, year, first author, journal)
        env:
          # Optional repository variable: a contact address for Crossref's polite pool.
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python scripts/check_citations.py
